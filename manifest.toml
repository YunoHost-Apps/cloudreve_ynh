#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cloudreve"
name = "Cloudreve"
description.en = "File management and sharing system, supports multiple storage providers"
description.fr = "Système de gestion et de partage de fichiers, prenant en charge plusieurs fournisseurs de stockage"

version = "4.18.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-3.0"
website = "https://cloudreve.org/"
demo = "https://demo.cloudreve.org/session"
admindoc = "https://docs.cloudreve.org/en/"
code = "https://github.com/cloudreve/Cloudreve"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/cloudreve/cloudreve/releases/download/4.18.0/cloudreve_4.18.0_linux_amd64.tar.gz"
    amd64.sha256 = "159b15fc3c2bd1dcafb4709c8d505d3dac06cd5f2e891f2ecdcedf49f287e266"
    arm64.url = "https://github.com/cloudreve/cloudreve/releases/download/4.18.0/cloudreve_4.18.0_linux_arm64.tar.gz"
    arm64.sha256 = "e97594da2e09149eb5535aa78e3790340925e0cbd8755ab449d0eb64bbf01a30"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = ".*_linux_arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    
    [resources.ports]

    [resources.apt]
    packages = "postgresql, redis-server"

    [resources.database]
    type = "postgresql"
